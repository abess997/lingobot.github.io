<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#000}
#b{position:relative;width:1584px;height:396px;overflow:hidden;background:radial-gradient(90% 130% at 52% 40%,#132a8f 0%,#0b1d72 55%,#07145a 100%)}
.l{position:absolute;inset:0}#p{position:absolute;left:657px;top:-36px;width:344px;filter:drop-shadow(16px 8px 22px rgba(3,8,40,.5))}
text{font-family:Montserrat;font-weight:900;fill:#fff;letter-spacing:6px}</style></head><body><div id="b">
<svg class="l" viewBox="0 0 1584 396"><text id="L" text-anchor="end">REA</text><text id="R">LTY</text></svg>
<img id="p" src="person2.png">
</div>
<script>
document.fonts.ready.then(()=>{
 const L=document.getElementById('L'),R=document.getElementById('R');
 const LX0=80,LX1=690,RX0=918,RX1=1504;let fs=330;
 const set=()=>{for(const t of [L,R])t.style.fontSize=fs+'px';};
 set();while((L.getBBox().width>LX1-LX0||R.getBBox().width>RX1-RX0)&&fs>120){fs-=2;set();}
 const cap=fs*0.70, by=Math.round(198+cap/2);
 L.setAttribute('x',LX1);L.setAttribute('y',by);R.setAttribute('x',RX0);R.setAttribute('y',by);
 // spread: stretch each group to fill its half evenly
 const wl=L.getBBox().width,wr=R.getBBox().width,w=Math.max(wl,wr);
 L.setAttribute('textLength',w);L.setAttribute('lengthAdjust','spacing');
 R.setAttribute('textLength',w);R.setAttribute('lengthAdjust','spacing');
 document.title='fs='+fs;
});
</script></body></html>
